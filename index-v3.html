<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穿透式监管系统 V2.0</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/dayjs/dayjs.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/antd@5.20.3/dist/reset.css">
<script src="https://unpkg.com/antd@5.20.3/dist/antd.min.js"></script>
<script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
<style>
:root{
  --bg-shell:#f4f7fb;
  --bg-panel:#ffffff;
  --bg-soft:#f7fafe;
  --line:#e6edf6;
  --line-strong:#d8e3f0;
  --text-main:#1f3147;
  --text-sub:#667a91;
  --text-faint:#8ea0b5;
  --brand:#246bdb;
  --brand-deep:#174ea6;
  --brand-soft:#eaf3ff;
  --workspace:#edf4fc;
  --shadow-card:0 10px 24px rgba(27,62,113,0.08);
  --shadow-soft:0 18px 50px rgba(19,51,101,0.08);
  --radius-xl:20px;
  --radius-lg:16px;
  --radius-md:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%;width:100%;overflow:hidden;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-shell);color:var(--text-main)}
body{background:
  radial-gradient(circle at top left,rgba(36,107,219,0.08),transparent 28%),
  radial-gradient(circle at top right,rgba(22,163,74,0.06),transparent 26%),
  linear-gradient(180deg,#f8fbff 0%,#f3f7fc 48%,#eff4fa 100%)}
.viewport-stage{width:100vw;height:100vh;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;background:#eaf0f8}
.login-page{width:1920px;height:1080px;background:linear-gradient(135deg,#0d2747 0%,#1f4f87 100%);display:flex;align-items:center;justify-content:center;padding:32px}
.login-card{background:rgba(255,255,255,0.96);border-radius:24px;padding:48px 40px;width:420px;box-shadow:0 24px 70px rgba(5,21,46,0.28);border:1px solid rgba(255,255,255,0.35)}
.login-title{text-align:center;font-size:26px;font-weight:700;color:#17385e;margin-bottom:8px}
.login-subtitle{text-align:center;font-size:14px;color:var(--text-sub);margin-bottom:32px}
.login-footer{text-align:center;color:var(--text-faint);font-size:12px;margin-top:24px}
.login-hint{text-align:center;color:var(--brand);font-size:13px;margin-top:12px}
.app-layout{width:1920px;height:1080px;display:flex;flex-direction:column;background:transparent;flex:0 0 auto;transform-origin:top center}
.app-header{height:68px;background:rgba(255,255,255,0.94);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid rgba(221,231,243,0.88);box-shadow:0 8px 28px rgba(16,39,80,0.05);z-index:10;flex:0 0 auto}
.app-header-left{display:flex;align-items:center;gap:14px;min-width:0}
.app-header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.app-body{display:flex;flex:1;overflow:hidden;min-height:0}
.app-sider{width:240px;background:linear-gradient(180deg,rgba(255,255,255,0.96) 0%,rgba(248,251,255,0.98) 100%);border-right:1px solid var(--line);padding:12px 10px 16px;overflow-y:auto;overflow-x:hidden;transition:width 0.2s ease,padding 0.2s ease;flex-shrink:0}
.app-sider.collapsed{width:84px;padding-left:10px;padding-right:10px}
.app-content{flex:1;padding:16px 20px 18px;overflow:hidden;background:linear-gradient(180deg,#edf4fc 0%,#e8f0fa 100%);min-width:0}
.page-surface{height:100%;max-width:none;margin:0;display:flex;flex-direction:column;gap:12px;overflow:auto}
.sider-logo{min-height:58px;display:flex;align-items:center;justify-content:flex-start;padding:12px 16px;color:#163a67;font-size:16px;font-weight:700;border:1px solid var(--line);background:linear-gradient(135deg,#fafdff 0%,#eef5ff 100%);border-radius:16px;white-space:nowrap;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,0.9);margin-bottom:10px}
.app-sider.collapsed .sider-logo{justify-content:center;padding:16px 10px;font-size:14px}
.left-right-layout{display:grid;grid-template-columns:minmax(280px,320px) minmax(0,1fr);gap:18px;align-items:stretch}
.left-panel,.right-panel{min-width:0;height:100%}
.left-panel>.ant-card{height:100%}
.right-panel{display:flex;flex-direction:column;gap:12px}
.right-panel>.ant-card{flex:1;margin-top:0 !important}
.status-flow{display:flex;align-items:center;gap:8px;padding:8px 0 2px;flex-wrap:wrap}
.flow-step{padding:7px 16px;border-radius:999px;font-size:13px;background:#edf3fb;color:var(--text-sub);border:1px solid #dce7f4}
.flow-step.active{background:linear-gradient(135deg,#2f74e3 0%,#1f5fc5 100%);color:#fff;border-color:transparent;box-shadow:0 8px 16px rgba(36,107,219,0.22)}
.flow-arrow{color:#9db0c4;font-size:18px}
.chart-container{width:100%;height:340px}
.ai-chat-area{border:1px solid var(--line);border-radius:18px;padding:18px;min-height:400px;max-height:500px;overflow-y:auto;background:linear-gradient(180deg,#f8fbff 0%,#fdfefe 100%)}
.ai-message{margin-bottom:12px;padding:12px 16px;border-radius:14px;max-width:80%;line-height:1.7;box-shadow:0 6px 18px rgba(24,51,94,0.04)}
.ai-message.user{background:linear-gradient(135deg,#2b6fdd 0%,#1959bf 100%);color:#fff;margin-left:auto}
.ai-message.assistant{background:#fff;border:1px solid var(--line);color:var(--text-main)}
.app-sider::-webkit-scrollbar,.app-content::-webkit-scrollbar{width:8px}
.app-sider::-webkit-scrollbar-thumb,.app-content::-webkit-scrollbar-thumb{background:#c9d6e5;border-radius:999px}
.app-sider .ant-menu{background:transparent;border-inline-end:none}
.app-sider .ant-menu-light.ant-menu-root.ant-menu-inline{border-inline-end:none}
.app-sider .ant-menu-item,
.app-sider .ant-menu-submenu-title{height:36px;line-height:36px;border-radius:10px;margin:2px 0;color:#35516f;font-weight:600}
.app-sider .ant-menu-sub.ant-menu-inline{background:transparent}
.app-sider .ant-menu-item-selected{background:linear-gradient(135deg,#2d73e1 0%,#1b5fc7 100%) !important;color:#fff !important;box-shadow:0 10px 18px rgba(36,107,219,0.24)}
.app-sider .ant-menu-item-selected .ant-menu-title-content,
.app-sider .ant-menu-item-selected .ant-menu-item-icon{color:#fff !important}
.app-sider .ant-menu-submenu-selected>.ant-menu-submenu-title{color:#173a68}
.app-sider .ant-menu-inline .ant-menu-item,
.app-sider .ant-menu-inline .ant-menu-submenu-title{width:calc(100% - 4px)}
.app-sider .ant-menu-item:hover,
.app-sider .ant-menu-submenu-title:hover{color:#174ea6;background:#edf4ff}
.app-header .ant-btn-text{color:#36516c}
.app-header .ant-tag{border-radius:999px;padding-inline:10px}
.ant-breadcrumb{font-size:13px;color:var(--text-sub)}
.ant-breadcrumb-link,.ant-breadcrumb-separator{color:var(--text-sub) !important}
.ant-card{border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-card);background:rgba(255,255,255,0.97);overflow:hidden}
.ant-card .ant-card-head{min-height:48px;padding:0 18px;border-bottom:1px solid #edf2f8}
.ant-card .ant-card-head-title{font-size:16px;font-weight:700;color:var(--text-main)}
.ant-card .ant-card-body{padding:16px 18px}
.ant-card-small .ant-card-head{min-height:44px;padding:0 16px}
.ant-card-small .ant-card-body{padding:14px 16px}
.ant-statistic{padding:2px 0}
.ant-statistic .ant-statistic-title{color:var(--text-sub);font-size:13px}
.ant-statistic .ant-statistic-content{color:var(--text-main);font-weight:700}
.ant-table-wrapper{border-radius:14px}
.ant-table-thead>tr>th{background:#f7faff !important;color:#47627f;font-weight:700;border-bottom:1px solid #e4edf7 !important}
.ant-table-tbody>tr>td{border-bottom:1px solid #edf2f8 !important}
.ant-table-tbody>tr:hover>td{background:#f8fbff !important}
.ant-descriptions-bordered .ant-descriptions-item-label{background:#f7faff;color:#516a86;width:150px}
.ant-tabs-top>.ant-tabs-nav::before{border-bottom:1px solid var(--line)}
.ant-tabs .ant-tabs-tab{padding:12px 0;font-weight:600;color:#5b718b}
.ant-tabs .ant-tabs-tab.ant-tabs-tab-active .ant-tabs-tab-btn{color:var(--brand)}
.ant-tabs .ant-tabs-ink-bar{background:var(--brand);height:3px;border-radius:999px}
.ant-input,.ant-input-number,.ant-select-selector,.ant-picker,.ant-input-affix-wrapper{border-radius:12px !important;border-color:#d8e3f0 !important}
.ant-input:focus,.ant-input-focused,.ant-input-number-focused,.ant-input-affix-wrapper-focused,.ant-select-focused .ant-select-selector,.ant-picker-focused{box-shadow:0 0 0 3px rgba(36,107,219,0.12) !important;border-color:#6d9df1 !important}
.ant-btn{border-radius:12px;font-weight:600}
.ant-btn-primary{background:linear-gradient(135deg,#2e73e2 0%,#1b5fc7 100%);border-color:#1b5fc7;box-shadow:0 10px 16px rgba(36,107,219,0.16)}
.ant-btn-primary:hover{background:linear-gradient(135deg,#387de9 0%,#2368d2 100%) !important;border-color:#2368d2 !important}
.ant-progress-bg{border-radius:999px}
.page-surface>.ant-row{margin-bottom:0 !important}
.page-surface .ant-row{row-gap:16px;align-items:stretch}
.page-surface .ant-col>.ant-card{height:100%}
.hero-card{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at top right,rgba(104,152,255,0.22),transparent 32%),
    linear-gradient(135deg,#16355f 0%,#1e4f89 52%,#245eb0 100%);
  color:#fff;
  border:none;
  box-shadow:0 22px 44px rgba(17,53,104,0.22);
}
.hero-card .ant-card-body{padding:26px 28px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,0.9fr);gap:20px;align-items:stretch}
.hero-eyebrow{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,0.12);font-size:12px;font-weight:700;letter-spacing:1px}
.hero-title{font-size:30px;font-weight:800;line-height:1.2;margin-top:16px}
.hero-subtitle{margin-top:10px;font-size:14px;line-height:1.8;color:rgba(255,255,255,0.8);max-width:720px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.hero-actions .ant-btn{height:42px;padding-inline:18px;border-radius:999px}
.hero-actions .ghost-btn{background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.2);color:#fff}
.hero-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hero-side-card{padding:16px;border-radius:18px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.14);backdrop-filter:blur(8px)}
.hero-side-label{font-size:12px;color:rgba(255,255,255,0.74)}
.hero-side-value{margin-top:8px;font-size:30px;font-weight:800;line-height:1}
.hero-side-note{margin-top:8px;font-size:12px;color:rgba(255,255,255,0.72);line-height:1.6}
.metric-card{border-radius:18px;box-shadow:0 14px 28px rgba(20,55,104,0.08)}
.metric-topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.metric-title{font-size:13px;color:var(--text-sub);font-weight:600}
.metric-badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
.metric-badge.red{background:#fff1f0;color:#d4380d}
.metric-badge.orange{background:#fff7e6;color:#d46b08}
.metric-badge.blue{background:#e6f4ff;color:#1765d1}
.metric-badge.green{background:#edfdf3;color:#1f8f52}
.metric-value{margin-top:14px;font-size:30px;font-weight:800;color:var(--text-main);line-height:1}
.metric-note{margin-top:10px;font-size:12px;color:var(--text-sub);line-height:1.7}
.topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.topic-card{padding:20px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%);box-shadow:0 12px 28px rgba(18,49,96,0.06)}
.topic-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.topic-card-title{font-size:18px;font-weight:800;color:var(--text-main)}
.topic-card-desc{margin-top:8px;font-size:13px;line-height:1.8;color:var(--text-sub)}
.topic-chip{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#edf4ff;color:#215fc3}
.topic-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.topic-stat{padding:12px 10px;border-radius:14px;background:#fff;border:1px solid #edf2f8}
.topic-stat-label{font-size:12px;color:var(--text-sub)}
.topic-stat-value{margin-top:6px;font-size:24px;font-weight:800;color:var(--text-main);line-height:1}
.topic-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:14px;border-top:1px dashed #dde7f4}
.topic-links{display:flex;gap:8px;flex-wrap:wrap}
.topic-link-btn{padding:0;border:none;background:none;color:#1e63cf;font-size:13px;font-weight:700;cursor:pointer}
.topic-focus{margin-top:10px;font-size:12px;line-height:1.7;color:var(--text-sub)}
.ops-list{display:flex;flex-direction:column;gap:12px}
.ops-item{padding:14px 16px;border-radius:16px;background:#f8fbff;border:1px solid #e8f0fb}
.ops-item-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ops-item-title{font-size:14px;font-weight:700;color:var(--text-main)}
.ops-item-desc{margin-top:8px;font-size:12px;line-height:1.7;color:var(--text-sub)}
.support-list{display:flex;flex-direction:column;gap:12px}
.support-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px dashed #e6edf6}
.support-row:last-child{border-bottom:none;padding-bottom:0}
.support-title{font-size:13px;font-weight:700;color:var(--text-main)}
.support-meta{margin-top:4px;font-size:12px;color:var(--text-sub);line-height:1.6}
.support-value{font-size:20px;font-weight:800;color:var(--text-main);line-height:1}
.signal-list{display:flex;flex-wrap:wrap;gap:8px}
.signal-pill{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700}
.signal-pill.red{background:#fff1f0;color:#cf1322}
.signal-pill.orange{background:#fff7e6;color:#d46b08}
.signal-pill.blue{background:#e6f4ff;color:#1765d1}
.signal-pill.green{background:#edfdf3;color:#1f8f52}
.flow-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.flow-node{padding:12px 8px;border-radius:14px;background:#f7fafe;border:1px solid #e7eef8;text-align:center}
.flow-node-value{font-size:22px;font-weight:800;color:var(--text-main);line-height:1}
.flow-node-label{margin-top:6px;font-size:12px;color:var(--text-sub)}
.insight-note{padding:14px 16px;border-radius:16px;background:linear-gradient(180deg,#f7fbff 0%,#ffffff 100%);border:1px solid #e5eef9;font-size:13px;line-height:1.8;color:var(--text-sub)}
.detail-shell{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto auto;gap:12px;align-content:start;align-items:start;overflow:auto;padding:12px;border:1px solid #d8e5f4;border-radius:18px;background:
  radial-gradient(circle at 96% 4%,rgba(36,107,219,0.08),transparent 22%),
  linear-gradient(180deg,#f5f9ff 0%,#eaf2fc 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.92)}
.detail-main,.detail-side{min-width:0;align-self:stretch}
.detail-main>.detail-stack{height:100%}
.detail-main>.detail-stack>.section-split:last-child{flex:1}
.detail-main>.detail-stack>.ant-card:last-child{flex:1}
.detail-main>.detail-stack>.ant-tabs:last-child{display:flex;flex:1;flex-direction:column}
.detail-main>.detail-stack>.ant-tabs:last-child>.ant-tabs-content-holder{flex:1}
.detail-full{grid-column:1 / -1;min-width:0}
.detail-stack{display:flex;flex-direction:column;gap:12px}
.detail-hero{padding:18px 20px;border-radius:16px;background:linear-gradient(135deg,#ffffff 0%,#f5f9ff 100%);border:1px solid #e6eef9;box-shadow:0 14px 28px rgba(18,49,96,0.06)}
.detail-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.detail-hero-title{font-size:22px;font-weight:800;color:var(--text-main);line-height:1.3}
.detail-hero-desc{margin-top:7px;font-size:13px;line-height:1.65;color:var(--text-sub);max-width:920px}
.tag-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.info-kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.info-kpi{padding:13px 14px;border-radius:14px;background:#fff;border:1px solid #e8eef8}
.info-kpi-label{font-size:12px;color:var(--text-sub)}
.info-kpi-value{margin-top:8px;font-size:26px;font-weight:800;color:var(--text-main);line-height:1}
.info-kpi-note{margin-top:6px;font-size:12px;color:var(--text-sub);line-height:1.6}
.section-split{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(320px,0.88fr);gap:16px;align-items:stretch}
.section-split>*{min-width:0;height:100%}
.section-split>.soft-panel{display:flex;flex-direction:column}
.section-split>.soft-panel>.evidence-list{flex:1}
.soft-panel{padding:15px;border-radius:15px;background:linear-gradient(180deg,#fbfdff 0%,#f7fbff 100%);border:1px solid #e7eef8}
.soft-panel-title{font-size:16px;font-weight:800;color:var(--text-main)}
.soft-panel-subtitle{margin-top:6px;font-size:12px;color:var(--text-sub);line-height:1.7}
.evidence-list{display:flex;flex-direction:column;gap:9px;margin-top:11px}
.evidence-item{padding:11px 12px 10px;border-radius:12px;background:#fff;border:1px solid #e8eef8}
.evidence-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.evidence-title{font-size:14px;font-weight:700;color:var(--text-main)}
.evidence-desc{margin-top:8px;font-size:12px;line-height:1.7;color:var(--text-sub)}
.board-status-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed #dbe6f3}
.board-status-cell{padding:9px 8px;border-radius:10px;background:#fff;border:1px solid #e8eef8}
.board-status-value{font-size:18px;font-weight:800;color:var(--text-main);line-height:1}
.board-status-label{margin-top:6px;font-size:12px;color:var(--text-sub)}
.mini-timeline{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.mini-step{display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;align-items:start}
.mini-dot{width:12px;height:12px;border-radius:999px;background:#2f74e3;box-shadow:0 0 0 4px rgba(47,116,227,0.14);margin-top:4px}
.mini-step-title{font-size:14px;font-weight:700;color:var(--text-main)}
.mini-step-meta{margin-top:4px;font-size:12px;line-height:1.7;color:var(--text-sub)}
.side-card{padding:15px;border-radius:15px;background:#fff;border:1px solid #e7eef8;box-shadow:0 12px 24px rgba(18,49,96,0.05)}
.side-card-title{font-size:16px;font-weight:800;color:var(--text-main)}
.side-card-block{padding:11px 0;border-bottom:1px dashed #e6edf6}
.side-card-block:last-child{border-bottom:none;padding-bottom:0}
.side-card-label{font-size:12px;color:var(--text-sub)}
.side-card-value{margin-top:6px;font-size:20px;font-weight:800;color:var(--text-main);line-height:1.3}
.side-card-desc{margin-top:6px;font-size:12px;line-height:1.7;color:var(--text-sub)}
.decision-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.decision-item{padding:12px 14px;border-radius:14px;background:#f8fbff;border:1px solid #e6eef8}
.decision-item-title{font-size:13px;font-weight:700;color:var(--text-main)}
.decision-item-desc{margin-top:6px;font-size:12px;line-height:1.7;color:var(--text-sub)}
.portrait-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.portrait-card{padding:16px;border-radius:16px;background:#fff;border:1px solid #e8eef8}
.portrait-card-title{font-size:12px;color:var(--text-sub)}
.portrait-card-value{margin-top:8px;font-size:26px;font-weight:800;color:var(--text-main)}

function appendFlowLog(clue,action,operator,note){return (clue.flowLogs||[]).concat([{time:nowText(),action:action,operator:operator||'系统',note:note||''}])}
function validateClueTransition(clue,fields){
  if(clue.status==='待派单'&&(!fields.handler||!fields.deadline||!fields.note))return'请完整填写处置人员、核查时限和派单说明';
  if(clue.status==='核查中'&&(!fields.conclusion||!fields.issueType||!fields.rectifyRequirement))return'请完整填写核查结论、问题定性和整改要求';
  if(clue.status==='待整改'&&(!fields.rectifyOwner||!fields.rectifyPlan))return'请完整填写整改责任人和整改计划';
  if(clue.status==='整改中'&&(!fields.rectifyResult||!fields.evidence))return'请完整填写整改结果和验收证据';
  if(clue.status==='待验收'&&!fields.reviewOpinion)return'请填写验收意见';
  return'';
}
function buildClueTransition(clue,fields,operator){
  var error=validateClueTransition(clue,fields||{}),next=getClueNext(clue.status);
  if(error||!next)return{error:error||'当前状态无法继续流转'};
  var action=getClueActionLabel(clue.status),updates={status:next,updateTime:nowText()},logNote='';
  if(clue.status==='待派单'){updates.handler=fields.handler;updates.deadline=fields.deadline;updates.assignmentNote=fields.note;logNote='派单给 '+fields.handler+'，核查期限：'+fields.deadline+'。'+fields.note}
  if(clue.status==='核查中'){updates.checkConclusion=fields.conclusion;updates.issueType=fields.issueType;updates.rectifyRequirement=fields.rectifyRequirement;logNote='核查结论：'+fields.conclusion+'；整改要求：'+fields.rectifyRequirement}
  if(clue.status==='待整改'){updates.rectifyOwner=fields.rectifyOwner;updates.rectifyPlan=fields.rectifyPlan;logNote='整改责任人：'+fields.rectifyOwner+'；整改计划：'+fields.rectifyPlan}
  if(clue.status==='整改中'){updates.rectifyResult=fields.rectifyResult;updates.evidence=((clue.evidence||'')+'；'+fields.evidence).replace(/^；/,'');logNote='整改结果：'+fields.rectifyResult+'；验收证据：'+fields.evidence}
  if(clue.status==='待验收'){updates.reviewOpinion=fields.reviewOpinion;updates.closeTime=nowText();logNote='验收意见：'+fields.reviewOpinion}
  updates.flowLogs=appendFlowLog(clue,action,operator,logNote);
  return{clue:Object.assign({},clue,updates),action:action,next:next};
}
